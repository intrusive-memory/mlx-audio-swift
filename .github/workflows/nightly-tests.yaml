name: Nightly Local-Only Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: false

env:
  MLXAUDIO_NETWORK_TESTS: "1"
  ACERVO_APP_GROUP_ID: group.intrusive-memory.models

jobs:
  nightly-local-only:
    name: Nightly Local-Only Tests
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/SharedModels
          key: mlx-models-v2

      - name: Show cached models
        run: |
          echo "Cached models:"
          ls -la ~/Library/SharedModels/ 2>/dev/null || echo "No cache directory found"
          du -sh ~/Library/SharedModels/*/ 2>/dev/null || echo "No models cached"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-output.log

      - name: Test SNAC (codec - local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/SNACTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-snac-output.log

      - name: Test Mimi (codec - local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/MimiTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-mimi-output.log

      - name: Test Qwen3-TTS (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/Qwen3TTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-qwen3tts-output.log

      - name: Test LlamaTTS (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/LlamaTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-llamatts-output.log

      - name: Test Soprano TTS (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/SopranoTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-soprano-output.log

      - name: Test PocketTTS (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/PocketTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-pockettts-output.log

      - name: Test Qwen3-TTS Voice Design (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/Qwen3TTSVoiceDesignTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-qwen3tts-voicedesign-output.log

      - name: Test Qwen3 ASR (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/Qwen3ASRTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-qwen3asr-output.log

      - name: Test GLM ASR (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/GLMASRTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-glmasr-output.log

      - name: Test Marvis TTS Generate (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/MarvisTTSGenerateTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-marvis-output.log

      - name: Test Deterministic Generation (local-only)
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/DeterministicGenerationTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-deterministic-output.log

      - name: Test KV Cache Correctness (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/KVCacheCorrectnessTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-kvcache-output.log

      - name: Test Weight Round-Trip (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/WeightRoundTripTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-weight-roundtrip-output.log

      - name: Leak detection - Qwen3TTS (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionQwen3TTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-qwen3tts-output.log

      - name: Leak detection - LlamaTTS (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionLlamaTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-llamatts-output.log

      - name: Leak detection - SopranoTTS (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionSopranoTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-soprano-output.log

      - name: Leak detection - PocketTTS (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionPocketTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-pockettts-output.log

      - name: Leak detection - MarvisTTS (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionMarvisTTSTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-marvis-output.log

      - name: Leak detection - Qwen3ASR (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionQwen3ASRTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-qwen3asr-output.log

      - name: Leak detection - GLMASR (local-only)
        env:
          MLXAUDIO_NIGHTLY_RUN: "1"
        run: |
          xcodebuild test-without-building \
            -scheme MLXAudio-Package \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MLXAudioTests/TelemetryLeakDetectionGLMASRTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-leak-glmasr-output.log

      - name: Upload nightly test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-output
          path: |
            build-output.log
            test-snac-output.log
            test-mimi-output.log
            test-qwen3tts-output.log
            test-llamatts-output.log
            test-soprano-output.log
            test-pockettts-output.log
            test-qwen3tts-voicedesign-output.log
            test-qwen3asr-output.log
            test-glmasr-output.log
            test-marvis-output.log
            test-deterministic-output.log
            test-kvcache-output.log
            test-weight-roundtrip-output.log
            test-leak-qwen3tts-output.log
            test-leak-llamatts-output.log
            test-leak-soprano-output.log
            test-leak-pockettts-output.log
            test-leak-marvis-output.log
            test-leak-qwen3asr-output.log
            test-leak-glmasr-output.log
          retention-days: 14
